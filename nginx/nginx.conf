# ═══════════════════════════════════════════════════════════════════════════
# NGINX Load Balancer Configuration
# Requirement 5: Load Distribution
# ═══════════════════════════════════════════════════════════════════════════

# Upstream: Define backend servers
upstream django_app {
    # ── Load Balancing Strategy: Least Connections ────────────────────────
    # Why? Sends new requests to the server with fewest active connections
    # Better than round-robin because it accounts for varying request complexity:
    #   - Fast requests (GET /products/) complete quickly
    #   - Slow requests (POST /checkout/) take longer
    # Least connections prevents slow requests from piling up on one server

    least_conn;

    # Backend servers
    server app1:8000 max_fails=3 fail_timeout=30s;
    server app2:8000 max_fails=3 fail_timeout=30s;
    server app3:8000 max_fails=3 fail_timeout=30s;

    # Health check configuration:
    # - max_fails=3: Mark server as down after 3 failed requests
    # - fail_timeout=30s: Wait 30s before retrying failed server

    # Alternative strategies (commented out):

    # Round-robin (default if no directive specified):
    # Distributes evenly but doesn't account for request complexity
    # server app1:8000;
    # server app2:8000;
    # server app3:8000;

    # IP Hash (session persistence):
    # Same client IP always routes to same backend
    # Useful for stateful apps, but we use token auth (stateless)
    # ip_hash;
    # server app1:8000;
    # server app2:8000;
    # server app3:8000;

    # Weighted distribution:
    # If servers have different capacities
    # server app1:8000 weight=3;  # 3x more requests
    # server app2:8000 weight=2;
    # server app3:8000 weight=1;
}

server {
    listen 80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Client request limits
    client_max_body_size 20M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Static files (served directly by Nginx, not proxied)
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API requests (proxied to Django backends)
    location / {
        # Proxy to upstream Django app cluster
        proxy_pass http://django_app;

        # Headers for backend to identify original request
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering (improves performance for slow clients)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Connection reuse (reduces overhead)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Error handling: try next server if one fails
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Health check endpoint (optional but recommended)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# Load Distribution Strategy Justification
# ═══════════════════════════════════════════════════════════════════════════
#
# Chosen: Least Connections
#
# Reasoning:
# 1. E-commerce workload is mixed:
#    - Light: GET /products/, GET /cart/ (50-200ms)
#    - Heavy: POST /checkout/ (500-2000ms due to transactions)
#
# 2. Round-robin problem:
#    - Server 1 gets 3 heavy checkouts → overloaded
#    - Server 2 gets 3 light product views → idle
#    - Users experience uneven response times
#
# 3. Least connections solution:
#    - Nginx tracks active connections per server
#    - Routes new request to least-busy server
#    - Automatic load balancing based on actual load
#
# 4. Why not IP hash?
#    - Token-based auth = stateless
#    - No session persistence needed
#    - IP hash would create uneven distribution if some users are more active
#
# 5. Capacity calculation:
#    - 3 servers × 2 Gunicorn workers = 6 parallel request handlers
#    - Under test: handles 100 concurrent users comfortably
#    - Each worker can handle ~16-17 users simultaneously
#    - Provides headroom for traffic spikes
#
# ═══════════════════════════════════════════════════════════════════════════
