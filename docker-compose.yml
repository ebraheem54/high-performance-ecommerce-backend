services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  migrate:
    build:
      context: .
      args:
        DEV: "true"
    env_file:
      - .env
    command: >
      sh -c "
        echo 'Waiting for database at ${DB_HOST}:${DB_PORT}...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo 'Database started'

        echo 'Running migrations...'
        python manage.py migrate --noinput
        echo 'Migrations completed'
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ═══════════════════════════════════════════════════════════════════════════
  # REQUIREMENT 5: Load Distribution - Multiple App Servers
  # ═══════════════════════════════════════════════════════════════════════════
  # Strategy: 3 app containers behind Nginx load balancer
  # Why 3? Provides redundancy + distributes 100 concurrent users evenly
  # Each container runs 2 Gunicorn workers = 6 total workers

  app1:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_app1
    restart: unless-stopped
    volumes:
      - .:/app
      - static-data:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "
        echo '[APP1] Waiting for database...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo '[APP1] Starting server with 2 workers...'
        gunicorn --workers=2 --bind=0.0.0.0:8000 config.wsgi:application
      "
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-network

  app2:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_app2
    restart: unless-stopped
    volumes:
      - .:/app
      - static-data:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "
        echo '[APP2] Waiting for database...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo '[APP2] Starting server with 2 workers...'
        gunicorn --workers=2 --bind=0.0.0.0:8000 config.wsgi:application
      "
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-network

  app3:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_app3
    restart: unless-stopped
    volumes:
      - .:/app
      - static-data:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "
        echo '[APP3] Waiting for database...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo '[APP3] Starting server with 2 workers...'
        gunicorn --workers=2 --bind=0.0.0.0:8000 config.wsgi:application
      "
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-network

  celery_worker:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_celery_worker
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "
        echo 'Waiting for database at ${DB_HOST}:${DB_PORT}...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo 'Database started'

        echo 'Starting Celery worker...'
        celery -A config worker -l info --concurrency=4
      "
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-network

  celery_beat:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_celery_beat
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "
        echo 'Waiting for database at ${DB_HOST}:${DB_PORT}...'
        until nc -z ${DB_HOST} ${DB_PORT}; do
          sleep 0.5
        done
        echo 'Database started'

        echo 'Starting Celery beat...'
        celery -A config beat -l info --scheduler django_celery_beat.schedulers.DatabaseScheduler
      "
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-network

  # Flower - Celery monitoring dashboard
  flower:
    build:
      context: .
      args:
        DEV: "true"
    container_name: ecommerce_flower
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - ecommerce-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - ecommerce-network

  locust:
    image: locustio/locust
    container_name: ecommerce_locust
    working_dir: /mnt/locust
    volumes:
      - .:/mnt/locust
    ports:
      - "8089:8089"
    networks:
      - ecommerce-network
    command: -f locustfile.py -H http://nginx:80

  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX - Load Balancer (Requirement 5)
  # ═══════════════════════════════════════════════════════════════════════════
  # Distributes incoming requests across app1, app2, app3
  # Strategy: Least Connections (most efficient for mixed workload)

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static-data:/static
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - ecommerce-network

volumes:
  dev-db-data:
  redis-data:
  static-data:

networks:
  ecommerce-network:
    driver: bridge
